name: sast-floor

# The named toolchain lane for the SECURITY deterministic floor (S7). Neither
# `make ci` nor the `check.yml` runner installs semgrep, and the real-scanner
# integration test (`tests.test_sast.TestScanRealSemgrep`) is `skipUnless`-gated
# on `sast.semgrep_path()` — so wherever the binary happens to be absent it
# skips silently, which would let the argv-conflict regression of S7 ship
# invisibly again. Do NOT re-word this as "the local build shell has no semgrep"
# — which box has which binary is not a fact this file can assert, and the
# claim was measurably false the last time this header made it. This lane
# installs semgrep at a pinned version so the guarantee rests on the lane and
# not on any box, HARD-
# ASSERTS it resolved (so a missing binary fails the job instead of vacuously
# skipping), and runs the full sast suite against the REAL binary. `p/default`
# is a Registry ruleset, so the lane needs network on every scan (disclosed in
# `scripts/sast.py`'s egress paragraph).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sast-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install semgrep==1.169.0

      - name: Assert semgrep resolved (fail, never skip)
        run: |
          python3 -c "import sys; from scripts import sast; sys.exit(0 if sast.semgrep_path() else 1)"

      - name: Run the sast suite against the real scanner
        run: |
          python3 -m unittest tests.test_sast -v
